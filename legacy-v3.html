<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MigraConnect – Prototyp</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#18263d;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:78px;background:#fff;display:flex;align-items:center;gap:22px;padding:0 30px;border-bottom:1px solid #e2e8f0}header strong{color:#4755c5;font-size:23px}header input{flex:1;max-width:550px;padding:13px 18px;border:1px solid #d9e1ee;border-radius:14px}header .avatar{margin-left:auto;background:#e7e9ff;border-radius:50%;height:44px;width:44px;display:grid;place-items:center;border:0;color:#3845a3;font-weight:bold}.shell{display:flex;min-height:calc(100vh - 138px)}aside{width:248px;background:white;padding:24px 14px;border-right:1px solid #e2e8f0;flex-shrink:0}aside button{width:100%;text-align:left;border:0;background:transparent;padding:14px;border-radius:12px;margin-bottom:8px;color:#334155}aside button.active,aside button:hover{background:#eef0ff;color:#3d49b5}main{flex:1;padding:36px;max-width:1200px;margin:auto;width:100%}.hero{background:linear-gradient(115deg,#4857c5,#8a75d7);color:white;border-radius:22px;padding:30px;margin-bottom:25px}.hero h1{margin:0 0 10px;font-size:31px}.hero p{margin:0;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #e6eaf3;border-radius:18px;padding:24px;box-shadow:0 5px 24px #1c28500a}.card h2{font-size:20px;margin:0 0 10px}.card p{color:#5b6780;line-height:1.6}.card button,.primary{background:#4857c5;color:white;border:0;border-radius:10px;padding:11px 16px}.secondary{background:#eef0ff;color:#3d49b5;border:0;border-radius:10px;padding:10px 14px}.field{display:block;width:100%;padding:12px;margin:10px 0;border:1px solid #d9e1ee;border-radius:10px}footer{height:60px;text-align:center;padding:18px;color:#64748b;background:white;border-top:1px solid #e2e8f0}.muted{color:#68758b}.tag{display:inline-block;background:#eef0ff;color:#4652b2;border-radius:30px;padding:5px 10px;font-size:12px}.job{border-bottom:1px solid #e6eaf3;padding:16px 0}.job:last-child{border:0}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.notice{background:#fff8e6;border:1px solid #f2d88a;border-radius:12px;padding:12px;margin:14px 0;font-size:14px}#mobileMenu{display:none}.hide{display:none!important}@media(max-width:700px){header{height:70px;padding:0 14px;gap:10px}header strong{font-size:17px}header input{width:25px;min-width:0;padding:10px}#mobileMenu{display:block;border:0;background:transparent;font-size:23px}aside{display:none;position:absolute;z-index:5;top:70px;bottom:60px;box-shadow:8px 8px 20px #18263d20}aside.open{display:block}.shell{min-height:calc(100vh - 130px)}main{padding:18px}.grid{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:25px}.card{padding:20px}}

.pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pill{border:1px solid #dce1f2;border-radius:30px;padding:8px 13px;background:#fff;color:#34436c}.pill.active{background:#4656bf;color:white}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{background:#fff;border-radius:14px;padding:18px;border:1px solid #e5e9f3}.stat strong{font-size:27px;display:block;color:#4656bf}.progress{height:10px;border-radius:12px;background:#e9edfa;overflow:hidden}.progress>div{height:100%;background:#4d5cc7}.answer{display:block;width:100%;text-align:left;margin:10px 0;padding:13px;border:1px solid #dbe2f2;border-radius:10px;background:#fff}.answer:hover{border-color:#4656bf}.answer.correct{background:#e5f7ed;border-color:#43a16c}.answer.wrong{background:#ffebed;border-color:#df6e7a}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.small{font-size:13px}.flex{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.status{padding:8px 12px;background:#eef4ff;border-radius:10px}.card+.card{margin-top:16px}.listitem{border-bottom:1px solid #e5eaf4;padding:16px 0}.listitem:last-child{border:0}label{display:block;margin-top:12px}.card button:disabled{opacity:.6;cursor:default}@media(max-width:700px){.two,.statgrid{grid-template-columns:1fr}.stat strong{font-size:22px}}

.result{background:#f4f6ff;border:1px solid #dfe5fa;border-radius:14px;padding:18px;margin-top:15px}.result h3{margin:0 0 10px}.meter{background:#edf0f9;border-radius:12px;height:12px;overflow:hidden}.meter>div{background:#5364c7;height:100%}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#e6f5ed;color:#17613e;font-size:12px}.tip{padding:10px 14px;border-left:3px solid #5364c7;background:#f6f7ff;margin:10px 0}.stack>*{margin-bottom:12px}textarea{resize:vertical}
</style></head><body><header><button id="mobileMenu" aria-label="Menü öffnen">☰</button><strong>✦ MigraConnect</strong><input id="search" aria-label="Suchen" placeholder="🔎  Suchen …"><button class="avatar" onclick="go('profile')" aria-label="Profil">👤</button></header><div class="shell"><aside id="nav"><button data-page="home" class="active">⌂ &nbsp; Startseite</button><button data-page="language">◉ &nbsp; Sprachlern-App</button><button data-page="translate">⇄ &nbsp; Echtzeitübersetzung</button><button data-page="jobs">▣ &nbsp; Jobportal</button><button data-page="community">♡ &nbsp; Community</button><button data-page="career">✦ &nbsp; Karriereassistent</button><button data-page="interview">🎙 &nbsp; Deutsch im Bewerbungsgespräch</button><button data-page="profile">♙ &nbsp; Mein Profil</button></aside><main id="main" aria-live="polite"></main></div><footer>MigraConnect · Interaktiver UX-Prototyp · Beispieldaten</footer><script>

['Bewerbung','die Frist','Die Bewerbungsfrist endet am Freitag.','Der letzte Zeitpunkt, bis zu dem etwas möglich ist','Ein Arbeitsort','Eine Gehaltsstufe','Ein Team']

{id:3,title:'Operations Coordinator',company:'Musterfirma',location:'Düsseldorf',mode:'Vor Ort',hours:'Teilzeit',skills:['Organisation','Excel'],description:'Koordination interner Abläufe und Unterstützung bei der Prozessoptimierung.'},
{id:4,title:'Junior Software Support',company:'StartDemo',location:'Deutschland',mode:'Remote',hours:'Teilzeit',skills:['IT-Grundlagen','Deutsch B1'],description:'Bearbeitung von Supportanfragen und Pflege von Hilfedokumenten.'},
{id:5,title:'Projektkoordinatorin Weiterbildung',company:'BildungsDemo',location:'Köln',mode:'Hybrid',hours:'Teilzeit',skills:['Kommunikation','Organisation'],description:'Koordination von Kursen, Anmeldungen und Teilnehmenden.'}
];
const phrases=[['Begrüßung','Guten Tag','Good afternoon','Dzień dobry'],['Begrüßung','Vielen Dank','Thank you very much','Dziękuję bardzo'],['Alltag','Wo ist die nächste Haltestelle?','Where is the nearest stop?','Gdzie jest najbliższy przystanek?'],['Alltag','Ich brauche einen Termin.','I need an appointment.','Potrzebuję terminu.'],['Beruf','Ich suche eine Arbeitsstelle.','I am looking for a job.','Szukam pracy.'],['Beruf','Ich habe Berufserfahrung.','I have work experience.','Mam doświadczenie zawodowe.'],['Bewerbung','Ich möchte mich bewerben.','I would like to apply.','Chcę złożyć podanie.'],['Bewerbung','Wann ist das Vorstellungsgespräch?','When is the interview?','Kiedy jest rozmowa kwalifikacyjna?']];
let current='home',quizState=null,jobFilter='',jobMode='Alle',jobHours='Alle',lessonCat='Alle',phraseCat='Alle';
function go(page){current=page;$('#nav').classList.remove('open');render();window.scrollTo(0,0)}
function hero(title,desc){return `<div class="hero"><h1>${title}</h1><p>${desc}</p></div>`}
function tile(title,desc,page,button){return `<div class="card"><h2>${title}</h2><p>${desc}</p><button onclick="go('${page}')">${button} →</button></div>`}
function progress(){return store.get('progress',{correct:0,total:0,rounds:[],mistakes:{}})}
function render(){let html='';const name=store.get('profile',{}).name||'du',pr=progress(),saved=store.get('savedJobs',[]);
if(current==='home')html=hero('Willkommen bei MigraConnect',`Hallo ${safe(name)}! Deutsch lernen, berufliche Möglichkeiten entdecken und sich vernetzen.`)+`<div class="statgrid"><div class="stat"><strong>${pr.rounds.length}</strong><span>Lernrunden</span></div><div class="stat"><strong>${pr.total?Math.round(pr.correct/pr.total*100):0}%</strong><span>Richtige Antworten</span></div><div class="stat"><strong>${saved.length}</strong><span>Gespeicherte Jobs</span></div></div><div class="grid">${tile('📚 Deutsch lernen','15 Übungen in drei Themenbereichen, Fehlertraining und Lernfortschritt.','language','Lernen')}${tile('💼 Jobportal','Beispielstellen durchsuchen, filtern, merken und mit deinem Profil vergleichen.','jobs','Jobs ansehen')}${tile('⇄ Übersetzung & Redewendungen','Offline-Phrasenbuch Deutsch, Englisch und Polnisch mit Suche und Kopierfunktion.','translate','Phrasen öffnen')}${tile('🎯 Karriereassistent','Berufliche Orientierung, Kompetenzanalyse und nächste Schritte.','career','Analyse starten')}${tile('🎙 Bewerbungstraining','Deutsch im Vorstellungsgespräch üben und Feedback erhalten.','interview','Üben')}${tile('🤝 Community','Themen und eigene Beiträge als lokale Demo ausprobieren.','community','Community öffnen')}</div><div class="notice">Dies ist ein lokaler Prototyp. Jobs und Community sind Beispieldaten. Es werden keine Daten an einen Server übertragen.</div>`;
if(current==='language'){html=hero('Deutsch lernen','Wortschatz für Alltag, Beruf und Bewerbung · 15 Fragen · Fehlertraining');if(!quizState){html+=`<div class="card"><h2>Wähle deinen Lernbereich</h2><div class="pills">${['Alle','Alltag','Beruf','Bewerbung'].map(c=>`<button class="pill ${lessonCat===c?'active':''}" onclick="lessonCat='${c}';render()">${c}</button>`).join('')}</div><div class="flex"><button class="primary" onclick="startQuiz(false)">Neue Lernrunde starten</button><button class="secondary" onclick="startQuiz(true)" ${Object.keys(pr.mistakes).length?'':'disabled'}>Fehler wiederholen (${Object.keys(pr.mistakes).length})</button></div><p class="muted small">Du erhältst nach jeder Antwort eine Erklärung mit einem Beispielsatz. Dein Fortschritt wird im Browser gespeichert.</p></div><div class="card"><h2>Dein Lernfortschritt</h2><p>${pr.correct} von ${pr.total} Antworten richtig</p><div class="progress"><div style="width:${pr.total?Math.round(pr.correct/pr.total*100):0}%"></div></div>${pr.rounds.slice(-4).reverse().map(r=>`<p class="small">${safe(r.date)} · ${safe(r.category)} · ${r.correct}/${r.total} richtig</p>`).join('')||'<p class="muted">Noch keine Lernrunden abgeschlossen.</p>'}</div>`}else{const q=vocabulary[quizState.ids[quizState.index]];if(!q){html+=`<div class="card"><h2>Runde abgeschlossen 🎉</h2><p>${quizState.correct} von ${quizState.ids.length} Antworten richtig.</p><button class="primary" onclick="finishQuiz()">Ergebnis speichern und zurück</button></div>`}else{html+=`<div class="card"><div class="row"><span class="tag">${safe(q[0])}</span><strong>${quizState.index+1} / ${quizState.ids.length}</strong></div><div class="progress" style="margin:14px 0"><div style="width:${Math.round(quizState.index/quizState.ids.length*100)}%"></div></div><h2>Was bedeutet „${safe(q[1])}“?</h2><div>${quizState.order.map((a,i)=>`<button class="answer ${quizState.selected===null?'':a===0?'correct':quizState.selected===a?'wrong':''}" ${quizState.selected===null?'':'disabled'} onclick="chooseAnswer(${a})">${safe(q[3+a])}</button>`).join('')}</div>${quizState.selected!==null?`<div class="notice">${quizState.selected===0?'Richtig! 🎉':'Noch nicht richtig.'}<br><strong>Beispiel:</strong> ${safe(q[2])}<br><strong>Erklärung:</strong> ${safe(q[3])}</div><button class="primary" onclick="nextQuiz()">${quizState.index===quizState.ids.length-1?'Ergebnis anzeigen':'Nächste Frage'} →</button>`:'<p class="muted">Wähle eine Antwort.</p>'}</div>`}}}
if(current==='career'){
 const report=store.get('careerReport',null),p=store.get('profile',{});
 html=hero('Karriereassistent','Kompetenzen erfassen, berufliche Möglichkeiten vergleichen und einen Aktionsplan erstellen.')+`<div class="card"><div class="notice">Transparente Demo ohne KI: Die Analyse basiert auf nachvollziehbaren Regeln und fiktiven Stellen. Keine externe Datenübertragung und keine verbindliche Eignungsbewertung.</div><div class="two"><label>Berufswunsch<select class="field" id="careerGoal">${['Projektmanagement','Kundenbetreuung','IT','Organisation','Bildung'].map(v=>`<option ${p.interest===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Deutschkenntnisse<select class="field" id="careerLevel">${['A1','A2','B1','B2','C1','C2'].map(v=>`<option ${p.level===v?'selected':''}>${v}</option>`).join('')}</select></label></div><label>Meine Fähigkeiten (durch Kommas getrennt)<input id="careerSkills" class="field" maxlength="400" value="${safe(p.skills||'')}" placeholder="Organisation, Kommunikation, Excel"></label><label>Berufserfahrung und bisherige Tätigkeiten<textarea id="careerExperience" class="field" maxlength="1200" rows="4" placeholder="Welche Aufgaben hast du bisher übernommen?">${safe(store.get('careerExperience',''))}</textarea></label><div class="flex"><button class="primary" onclick="analyzeCareer()">Analyse erstellen</button><button class="secondary" onclick="downloadCareer()" ${report?'':'disabled'}>Analyse herunterladen</button></div></div><div id="careerOutput">${report?careerHtml(report):'<div class="card"><p class="muted">Trage deine Erfahrungen ein und starte die Analyse.</p></div>'}</div>`;
}
if(current==='interview'){
 const history=store.get('interviewHistory',[]),st=interviewState;
 html=hero('Deutsch im Bewerbungsgespräch','Antworten formulieren, üben und mit konkreten Hinweisen verbessern.')+`<div class="card"><div class="notice">Offline-Übung mit regelbasiertem Feedback. Es findet keine KI-Sprachanalyse statt. Die Antworten werden nur in diesem Browser gespeichert.</div><label>Schwierigkeitsgrad<select id="interviewLevel" class="field" onchange="interviewState.level=this.value;interviewState.index=0;interviewState.feedback=null;render()">${['B1','B2','C1'].map(v=>`<option ${st.level===v?'selected':''}>${v}</option>`).join('')}</select></label><span class="tag">Frage ${st.index+1} von ${interviewQuestions.length}</span><h2 style="margin-top:15px">${safe(interviewQuestions[st.index].q)}</h2><p class="muted">Tipp: ${safe(interviewQuestions[st.index].tip)}</p><label>Deine Antwort<textarea id="interviewAnswer" class="field" rows="6" maxlength="2500" placeholder="Schreibe deine Antwort auf Deutsch …">${safe(st.answer||'')}</textarea></label><div class="flex"><button class="primary" onclick="checkInterview()">Antwort prüfen</button><button class="secondary" onclick="nextInterview()">Nächste Frage →</button></div>${st.feedback?interviewFeedbackHtml(st.feedback):''}</div><div class="card"><h2>Meine letzten Übungen</h2>${history.slice(-5).reverse().map(h=>`<div class="listitem"><strong>${safe(h.question)}</strong><p class="muted small">${safe(h.date)} · ${safe(h.level)} · ${h.score}/4 Strukturmerkmale</p></div>`).join('')||'<p class="muted">Noch keine Übungen abgeschlossen.</p>'}</div>`;
}
if(current==='jobs'){const filtered=jobs.filter(j=>[j.title,j.company,j.location,j.description,...j.skills].join(' ').toLowerCase().includes(jobFilter.toLowerCase())&&(jobMode==='Alle'||j.mode===jobMode)&&(jobHours==='Alle'||j.hours===jobHours));html=hero('Jobportal','Fiktive Stellenangebote zum Ausprobieren der Suche und Merkliste')+`<div class="card"><label>Suche<input class="field" id="jobFilter" placeholder="Beruf, Ort oder Qualifikation" value="${safe(jobFilter)}" oninput="jobFilter=this.value;updateJobList()"></label><div class="two"><label>Arbeitsmodell<select class="field" onchange="jobMode=this.value;updateJobList()">${['Alle','Remote','Hybrid','Vor Ort'].map(v=>`<option ${v===jobMode?'selected':''}>${v}</option>`).join('')}</select></label><label>Arbeitszeit<select class="field" onchange="jobHours=this.value;updateJobList()">${['Alle','Teilzeit','Vollzeit'].map(v=>`<option ${v===jobHours?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="flex"><button class="secondary" onclick="jobFilter='';jobMode='Alle';jobHours='Alle';render()">Filter zurücksetzen</button><button class="secondary" onclick="showSavedOnly=!showSavedOnly;updateJobList()">${showSavedOnly?'Alle Stellen':'Nur Merkliste'}</button></div><div id="jobList"></div><div class="notice">Alle Unternehmen und Stellen sind erfunden. Es gibt keine echten Bewerbungslinks.</div></div>`}
if(current==='translate'){html=hero('Übersetzung & Redewendungen','Ein durchsuchbares Offline-Phrasenbuch für häufige Situationen')+`<div class="card"><div class="notice">Dies ist keine freie Echtzeitübersetzung. Es werden nur hinterlegte Beispielsätze übersetzt. Keine externe API.</div><label>Thema<select class="field" onchange="phraseCat=this.value;render()">${['Alle','Begrüßung','Alltag','Beruf','Bewerbung'].map(c=>`<option ${phraseCat===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Sprache<select class="field" id="targetLanguage" onchange="showPhrases()"><option value="en">Englisch</option><option value="pl">Polnisch</option></select></label><label>Redewendung suchen<input class="field" id="phraseSearch" oninput="showPhrases()" placeholder="z. B. Bewerbung"></label><div id="phrases"></div></div>`}
if(current==='community'){const posts=store.get('posts',[]);html=hero('Community','Erfahrungen teilen · lokale Demonstration ohne öffentliche Nutzerkonten')+`<div class="two"><div class="card"><h2>Neuen Beitrag verfassen</h2><label>Thema<select class="field" id="postTopic"><option>Berufseinstieg</option><option>Sprache & Alltag</option><option>Fragen zur Bewerbung</option></select></label><label>Dein Beitrag<textarea class="field" id="postText" rows="5" maxlength="500" placeholder="Was möchtest du teilen?"></textarea></label><button class="primary" onclick="addPost()">Beitrag lokal speichern</button><p id="postStatus" class="muted small">Beiträge sind nur in diesem Browser sichtbar.</p></div><div class="card"><h2>Community-Themen</h2><p>💼 Berufseinstieg</p><p>🌍 Sprache & Alltag</p><p>📝 Fragen zur Bewerbung</p><div class="notice">Keine echten Nachrichten oder anderen Mitglieder. Inhalte werden nicht veröffentlicht.</div></div></div><div class="card" style="margin-top:16px"><h2>Meine Beiträge (${posts.length})</h2>${posts.length?posts.slice().reverse().map(post=>`<div class="listitem"><span class="tag">${safe(post.topic)}</span><p>${safe(post.text)}</p><small class="muted">${safe(post.date)}</small> <button class="secondary" onclick="deletePost('${post.id}')">Löschen</button></div>`).join(''):'<p class="muted">Noch keine Beiträge vorhanden.</p>'}</div>`}
if(current==='profile'){const p=store.get('profile',{});html=hero('Mein Profil','Interessen, Sprachniveau und Kompetenzen lokal speichern')+`<div class="card"><label>Anzeigename<input class="field" id="name" maxlength="60" value="${safe(p.name||'')}" placeholder="Dein Name"></label><div class="two"><label>Deutschkenntnisse<select class="field" id="level">${['A1','A2','B1','B2','C1','C2'].map(l=>`<option ${p.level===l?'selected':''}>${l}</option>`).join('')}</select></label><label>Berufliches Interesse<select class="field" id="interest">${['Projektmanagement','Kundenbetreuung','IT','Organisation','Bildung','Andere'].map(l=>`<option ${p.interest===l?'selected':''}>${l}</option>`).join('')}</select></label></div><label>Kompetenzen (mit Komma trennen)<input class="field" id="skills" maxlength="300" value="${safe(p.skills||'')}" placeholder="z. B. Organisation, Excel, Kommunikation"></label><button class="primary" onclick="saveProfile()">Profil speichern</button><p id="profileStatus" class="muted small">Deine Angaben bleiben in diesem Browser.</p></div><div class="card"><h2>Deine Daten</h2><p class="muted">Du kannst alle lokal gespeicherten MigraConnect-Daten löschen.</p><button class="secondary" onclick="clearData()">Alle lokalen Daten löschen</button></div>`}
$('#main').innerHTML=html;document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));if(current==='jobs')updateJobList();if(current==='translate')showPhrases();}
let showSavedOnly=false;
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function startQuiz(mistakes){const pr=progress();let ids=vocabulary.map((_,i)=>i).filter(i=>mistakes?pr.mistakes[i]:lessonCat==='Alle'||vocabulary[i][0]===lessonCat);if(!ids.length)return;ids=shuffle(ids).slice(0,10);quizState={ids,index:0,correct:0,selected:null,order:shuffle([0,1,2,3]),category:mistakes?'Fehlertraining':lessonCat};render()}
function chooseAnswer(a){if(!quizState||quizState.selected!==null)return;quizState.selected=a;const pr=progress(),id=quizState.ids[quizState.index];pr.total++;if(a===0){quizState.correct++;pr.correct++;delete pr.mistakes[id]}else{pr.mistakes[id]=true}store.set('progress',pr);render()}
function nextQuiz(){quizState.index++;quizState.selected=null;quizState.order=shuffle([0,1,2,3]);render()}
function finishQuiz(){const pr=progress();pr.rounds.push({date:new Date().toLocaleDateString('de-DE'),category:quizState.category,correct:quizState.correct,total:quizState.ids.length});store.set('progress',pr);quizState=null;render()}
const interviewQuestions=[
{q:'Erzählen Sie etwas über sich und Ihren beruflichen Hintergrund.',tip:'Nenne deine Erfahrung, wichtige Aufgaben und dein berufliches Ziel.'},
{q:'Warum interessieren Sie sich für diese Stelle?',tip:'Verbinde deine Motivation mit mindestens einer konkreten Anforderung.'},
{q:'Beschreiben Sie eine Herausforderung bei der Arbeit und Ihre Lösung.',tip:'Beschreibe die Situation, deine Aufgabe, dein Vorgehen und das Ergebnis.'},
{q:'Welche Stärken bringen Sie für die Position mit?',tip:'Nenne eine Stärke und belege sie durch ein Beispiel.'},
{q:'Welche Fragen haben Sie an uns?',tip:'Frage nach Aufgaben, Einarbeitung oder Zusammenarbeit.'}
];
let interviewState={index:0,level:'B1',answer:'',feedback:null};
function normalizeTerms(text){return String(text||'').toLocaleLowerCase('de').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean)}
function scoreJob(j,skills,level){const tokens=skills.flatMap(x=>x.split(/\s+/)).filter(x=>x.length>2), matched=j.skills.filter(req=>{const r=req.toLocaleLowerCase('de');return tokens.some(t=>r.includes(t)||t.includes(r))});return {job:j,matched,missing:j.skills.filter(x=>!matched.includes(x)),percent:Math.round(100*matched.length/j.skills.length)}}
function analyzeCareer(){const skills=$('#careerSkills').value.trim(),experience=$('#careerExperience').value.trim(),goal=$('#careerGoal').value,level=$('#careerLevel').value;if(!skills&&!experience){alert('Bitte gib mindestens eine Fähigkeit oder Berufserfahrung ein.');return}const terms=normalizeTerms(skills).concat(normalizeTerms(experience).flatMap(x=>x.split(/\s+/).filter(w=>w.length>4)));const ranked=jobs.map(j=>scoreJob(j,terms,level)).sort((a,b)=>b.percent-a.percent);const report={date:new Date().toLocaleString('de-DE'),goal,level,skills,experience,ranked:ranked.map(x=>({title:x.job.title,company:x.job.company,percent:x.percent,matched:x.matched,missing:x.missing})),steps:[`Wähle 2–3 Stellen im Bereich ${goal} und notiere die häufigsten Anforderungen.`,ranked[0].missing.length?`Prüfe, ob du Erfahrung mit „${ranked[0].missing[0]}“ hast, und ergänze sie gegebenenfalls im Profil.`:'Ergänze zu deinen Fähigkeiten konkrete Beispiele aus deiner Berufserfahrung.','Formuliere eine kurze berufliche Selbstvorstellung und übe sie im Bewerbungstraining.']};store.set('careerReport',report);store.set('careerExperience',experience);store.set('profile',{...store.get('profile',{}),skills,interest:goal,level});$('#careerOutput').innerHTML=careerHtml(report)}
function careerHtml(r){return `<div class="card"><div class="row"><h2>Deine Auswertung</h2><span class="badge">Demo-Analyse</span></div><p class="muted small">Erstellt am ${safe(r.date)} · Interesse: ${safe(r.goal)} · Deutsch: ${safe(r.level)}</p><h3>Beispielstellen im Vergleich</h3>${r.ranked.slice(0,4).map(j=>`<div class="result"><div class="row"><strong>${safe(j.title)}</strong><strong>${j.percent}%</strong></div><div class="meter" style="margin:12px 0"><div style="width:${j.percent}%"></div></div><p class="small">Erkannte Übereinstimmungen: ${safe(j.matched.join(', ')||'Keine direkten Schlagwort-Treffer')}</p><p class="small">Nicht erkannte Anforderungen: ${safe(j.missing.join(', ')||'Keine')}</p></div>`).join('')}<p class="muted small">Die Prozentzahl beschreibt ausschließlich Schlagwort-Übereinstimmungen. Sie sagt nichts über deine tatsächliche Eignung aus.</p><h3>Deine nächsten Schritte</h3>${r.steps.map((t,i)=>`<div class="tip"><strong>${i+1}.</strong> ${safe(t)}</div>`).join('')}</div>`}
function downloadCareer(){const r=store.get('careerReport',null);if(!r)return;const lines=['MigraConnect – Karriereanalyse (regelbasierte Demo)','Datum: '+r.date,'Berufswunsch: '+r.goal,'Deutsch: '+r.level,'Fähigkeiten: '+r.skills,'Erfahrung: '+r.experience,'','Beispielstellen:',...r.ranked.map(j=>`${j.title}: ${j.percent}% Schlagwort-Übereinstimmung; erkannt: ${j.matched.join(', ')||'keine'}; nicht erkannt: ${j.missing.join(', ')||'keine'}`),'','Nächste Schritte:',...r.steps.map((x,i)=>`${i+1}. ${x}`),'','Hinweis: Keine KI-Analyse oder Eignungsbewertung.'];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='migraconnect-karriereanalyse.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function checkInterview(){const a=$('#interviewAnswer').value.trim();if(a.length<15){alert('Bitte schreibe eine ausführlichere Antwort (mindestens 15 Zeichen).');return}const words=a.split(/\s+/).filter(Boolean),criteria=[{ok:words.length>=35,yes:'Du hast deine Antwort ausführlich formuliert.',no:'Ergänze 2–3 konkrete Sätze, damit deine Antwort nachvollziehbarer wird.'},{ok:/\b(ich|mein|meine|meinen|mir)\b/i.test(a),yes:'Du beschreibst deine eigene Rolle.',no:'Beschreibe mit „ich“ genauer, was du selbst gemacht hast.'},{ok:/\b(zum beispiel|beispielsweise|etwa|konkret|als ich|in einem projekt)\b/i.test(a),yes:'Du nennst ein Beispiel oder leitest eines ein.',no:'Ergänze ein konkretes Beispiel aus deiner Erfahrung.'},{ok:/[.!?]\s+[^\s]/.test(a),yes:'Deine Antwort enthält mehrere Sätze.',no:'Gliedere deine Antwort in mehrere kurze Sätze.'}];const feedback={criteria,score:criteria.filter(c=>c.ok).length,wordCount:words.length};interviewState.answer=a;interviewState.feedback=feedback;const h=store.get('interviewHistory',[]);h.push({date:new Date().toLocaleDateString('de-DE'),level:interviewState.level,question:interviewQuestions[interviewState.index].q,answer:a,score:feedback.score});store.set('interviewHistory',h.slice(-25));render()}
function interviewFeedbackHtml(f){return `<div class="result"><h3>Feedback zur Antwort</h3><p>${f.wordCount} Wörter · ${f.score}/4 überprüfte Strukturmerkmale</p>${f.criteria.map(c=>`<div class="tip">${c.ok?'✓':'→'} ${safe(c.ok?c.yes:c.no)}</div>`).join('')}<p class="muted small">Diese Prüfung erkennt nur einfache Textmerkmale. Grammatik, Aussprache und inhaltliche Richtigkeit werden nicht bewertet.</p></div>`}
function nextInterview(){interviewState={...interviewState,index:(interviewState.index+1)%interviewQuestions.length,answer:'',feedback:null};render()}
function updateJobList(){const el=$('#jobList');if(!el)return;const saved=store.get('savedJobs',[]),p=store.get('profile',{}),skills=(p.skills||'').toLowerCase();let filtered=jobs.filter(j=>[j.title,j.company,j.location,j.description,...j.skills].join(' ').toLowerCase().includes(jobFilter.toLowerCase())&&(jobMode==='Alle'||j.mode===jobMode)&&(jobHours==='Alle'||j.hours===jobHours)&&(!showSavedOnly||saved.includes(j.id)));el.innerHTML=`<p class="muted small">${filtered.length} Beispielstellen gefunden</p>`+(filtered.map(j=>`<div class="listitem"><div class="row"><h3>${safe(j.title)}</h3><span class="tag">Demo</span></div><p>${safe(j.company)} · ${safe(j.location)} · ${safe(j.mode)} · ${safe(j.hours)}</p><p>${safe(j.description)}</p><p class="small"><strong>Beispiel-Anforderungen:</strong> ${j.skills.map(s=>`<span class="tag">${safe(s)}</span>`).join(' ')}</p>${p.skills?`<p class="small muted">Übereinstimmung mit deinen eingetragenen Kompetenzen: ${j.skills.filter(s=>skills.includes(s.toLowerCase())).length}/${j.skills.length} Schlagwörter (keine Eignungsbewertung)</p>`:''}<button class="${saved.includes(j.id)?'secondary':'primary'}" onclick="toggleSaved(${j.id})">${saved.includes(j.id)?'★ Gemerkt · entfernen':'☆ Stelle merken'}</button></div>`).join('')||'<p>Keine passenden Beispielstellen.</p>')}
function toggleSaved(id){let s=store.get('savedJobs',[]);s=s.includes(id)?s.filter(x=>x!==id):[...s,id];store.set('savedJobs',s);updateJobList()}
function showPhrases(){const el=$('#phrases');if(!el)return;const lang=$('#targetLanguage').value,query=$('#phraseSearch').value.toLowerCase();const filtered=phrases.filter(p=>(phraseCat==='Alle'||p[0]===phraseCat)&&p.join(' ').toLowerCase().includes(query));el.innerHTML=filtered.map((p,i)=>`<div class="listitem"><span class="tag">${safe(p[0])}</span><p><strong>${safe(p[1])}</strong><br>${safe(p[lang==='en'?2:3])}</p><button class="secondary" onclick="copyPhrase(${phrases.indexOf(p)},'${lang}')">Übersetzung kopieren</button></div>`).join('')||'<p>Keine passenden Redewendungen gefunden.</p>'}
async function copyPhrase(i,lang){const v=phrases[i][lang==='en'?2:3];try{await navigator.clipboard.writeText(v);alert('Text kopiert.')}catch{window.prompt('Zum Kopieren markieren:',v)}}
function addPost(){const text=$('#postText').value.trim();if(!text){$('#postStatus').textContent='Bitte gib einen Beitrag ein.';return}const posts=store.get('posts',[]);posts.push({id:String(Date.now()),text:text.slice(0,500),topic:$('#postTopic').value,date:new Date().toLocaleDateString('de-DE')});store.set('posts',posts);render()}
function deletePost(id){store.set('posts',store.get('posts',[]).filter(p=>p.id!==id));render()}
function saveProfile(){store.set('profile',{name:$('#name').value.trim(),level:$('#level').value,interest:$('#interest').value,skills:$('#skills').value.trim()});$('#profileStatus').textContent='Profil gespeichert.'}
function clearData(){if(!confirm('Wirklich alle lokal gespeicherten MigraConnect-Daten löschen?'))return;Object.keys(localStorage).filter(k=>k.startsWith('mc2-')).forEach(k=>localStorage.removeItem(k));quizState=null;render()}
document.querySelectorAll('aside button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#mobileMenu').onclick=()=>$('#nav').classList.toggle('open');$('#search').oninput=e=>{jobFilter=e.target.value;if(current!=='jobs'){current='jobs';render()}else updateJobList()};render();
</script></body></html>
